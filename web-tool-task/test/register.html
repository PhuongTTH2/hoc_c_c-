<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Web Tool Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .register-left {
            flex: 1;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 48px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-left h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .register-left p {
            opacity: 0.8;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .role-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .role-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }

        .register-right {
            flex: 1;
            padding: 48px;
        }

        .register-right h2 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        .register-right p {
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74,222,128,0.1);
        }

        .btn-register {
            width: 100%;
            background: #4ade80;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-register:hover {
            background: #22c55e;
            transform: translateY(-1px);
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #4ade80;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .role-hint {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .register-container {
                flex-direction: column;
            }
            .register-left {
                padding: 32px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-left">
            <h1>🚀 Web Tool Automation</h1>
            <p>Đăng ký tài khoản để bắt đầu<br>tự động hóa quy trình làm việc của bạn</p>
            <div class="role-list">
                <span class="role-badge">QA</span>
                <span class="role-badge">PM</span>
                <span class="role-badge">DEV</span>
                <span class="role-badge">PO</span>
                <span class="role-badge">PMO</span>
            </div>
        </div>
        <div class="register-right">
            <h2>Đăng ký tài khoản</h2>
            <p>Điền thông tin để tạo tài khoản mới</p>

            <form id="registerForm">
                <div class="form-group">
                    <label>👤 Họ và tên</label>
                    <input type="text" id="fullName" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="example@company.com" required>
                </div>
                <div class="form-group">
                    <label>🔒 Mật khẩu</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>🔒 Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>🎭 Vai trò (Role)</label>
                    <select id="role" required>
                        <option value="">-- Chọn vai trò --</option>
                        <option value="QA">QA - Quality Assurance</option>
                        <option value="PM">PM - Project Manager</option>
                        <option value="DEV">DEV - Developer</option>
                        <option value="PO">PO - Product Owner</option>
                        <option value="PMO">PMO - Project Management Office</option>
                    </select>
                    <div class="role-hint">
                        💡 Vai trò sẽ quyết định quyền truy cập và dashboard hiển thị
                    </div>
                </div>
                <button type="submit" class="btn-register">Đăng ký →</button>
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
            </form>

            <div class="login-link">
                Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script>
        // Lấy danh sách users từ localStorage
        function getUsers() {
            const users = localStorage.getItem('users');
            return users ? JSON.parse(users) : {};
        }

        // Lưu users vào localStorage
        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        // Thêm tài khoản demo nếu chưa có
        function initDemoUsers() {
            let users = getUsers();
            const demos = {
                'qa@company.com': { password: 'qa123', role: 'QA', name: 'Nguyễn Văn A' },
                'pm@company.com': { password: 'pm123', role: 'PM', name: 'Trần Thị B' },
                'dev@company.com': { password: 'dev123', role: 'DEV', name: 'Lê Văn C' },
                'po@company.com': { password: 'po123', role: 'PO', name: 'Phạm Thị D' },
                'pmo@company.com': { password: 'pmo123', role: 'PMO', name: 'Hoàng Văn E' }
            };
            
            let changed = false;
            for (const [email, data] of Object.entries(demos)) {
                if (!users[email]) {
                    users[email] = data;
                    changed = true;
                }
            }
            if (changed) {
                saveUsers(users);
            }
        }

        initDemoUsers();

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validate
            if (!fullName || !email || !password || !role) {
                errorDiv.textContent = 'Vui lòng điền đầy đủ thông tin!';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Mật khẩu xác nhận không khớp!';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'Mật khẩu phải có ít nhất 6 ký tự!';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Kiểm tra email đã tồn tại
            const users = getUsers();
            if (users[email]) {
                errorDiv.textContent = 'Email này đã được đăng ký! Vui lòng sử dụng email khác.';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Tạo tài khoản mới
            users[email] = {
                password: password,
                role: role,
                name: fullName
            };
            saveUsers(users);
            
            // Hiển thị thành công
            successDiv.textContent = '✅ Đăng ký thành công! Đang chuyển hướng đến trang đăng nhập...';
            successDiv.style.display = 'block';
            
            // Chuyển hướng sau 2 giây
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>
</html>
